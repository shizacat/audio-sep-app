[project]
name = "audiosep-app"
dynamic = ["version"]
description = "Desktop app for text-guided sound separation with AudioSep"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lameenc>=1.8.4",
    "miniaudio>=1.71",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "PySide6>=6.6",
    "soundfile>=0.14.0",
    "tokenizers>=0.23.2",
]

[project.scripts]
audiosep-app = "audiosep_app.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyinstaller>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/audiosep_app/__init__.py"

[tool.hatch.build.targets.wheel.force-include]
"src/audiosep_app/assets/tokenizer.json" = "audiosep_app/assets/tokenizer.json"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "bundle"]
extend-exclude = ["bundle/audiosep.spec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
