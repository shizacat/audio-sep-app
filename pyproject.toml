[project]
name = "audiosep-app"
dynamic = ["version"]
description = "Desktop app for text-guided sound separation with AudioSep"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyinstaller>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/audiosep_app/__init__.py"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
